<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outplay Gamehub | Board Game Tutorials</title>
<style>
:root{--cream:#FBF7EF;--ink:#292D38;--pink:#F5D3C9;--blue:#C6DFEA;--yellow:#F7DF8E;--green:#D9E8C6;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Noto Sans",sans-serif}
header{padding:32px 18px 24px;text-align:center;background:linear-gradient(135deg,#fffaf2,#f5e8d6);border-bottom:1px solid #eee2d2}
.brand{font-size:12px;letter-spacing:3px;font-weight:800;text-transform:uppercase;color:#68605a}
h1{font-size:clamp(30px,5vw,48px);margin:10px 0 8px;letter-spacing:-1.5px}
header p{margin:0 auto;max-width:620px;line-height:1.6;color:#625d57}
main{max-width:1120px;margin:auto;padding:24px 16px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 18px}
.search{flex:1;min-width:220px;padding:14px 16px;border:1px solid #e4d9ca;border-radius:14px;background:#fffdf9;font-size:16px;outline:none}
select,.lang{border:1px solid #e4d9ca;border-radius:14px;background:#fffdf9;padding:12px 14px;color:var(--ink);font-size:14px}
.quick-filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 24px}
.filter-card{border:0;border-radius:16px;padding:14px 8px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #0000000b;transition:.15s}
.filter-card:hover,.filter-card.active{transform:translateY(-2px);outline:2px solid var(--ink)}
.filter-card:nth-child(1){background:var(--pink)}.filter-card:nth-child(2){background:var(--blue)}.filter-card:nth-child(3){background:var(--yellow)}.filter-card:nth-child(4){background:var(--green)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:26px 0 14px}
.section-head h2{font-size:22px;margin:0}.count{font-size:13px;color:#777}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.game-card{overflow:hidden;background:var(--white);border:1px solid #eee4d7;border-radius:18px;box-shadow:0 5px 18px #4c39200a;cursor:pointer;transition:transform .15s,box-shadow .15s}
.game-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #4c392018}
.game-card img{width:100%;height:164px;object-fit:cover;display:block;background:#eee}
.card-body{padding:13px 14px 15px}.game-name{font-weight:800;font-size:16px;line-height:1.35;margin:0 0 5px}.game-zh{font-size:13px;color:#716c66;margin:0 0 12px}
.watch{border:0;background:var(--ink);color:white;border-radius:10px;padding:10px 12px;font-weight:700;width:100%;cursor:pointer}
.empty{display:none;text-align:center;padding:48px 12px;color:#777}
footer{text-align:center;padding:24px;color:#7a736a;font-size:12px}
dialog{border:0;border-radius:20px;max-width:420px;width:calc(100% - 30px);padding:24px;background:var(--white);color:var(--ink);box-shadow:0 20px 80px #0003}
dialog::backdrop{background:#292d3866}.modal-img{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:14px}
.modal-title{font-size:23px;font-weight:800;margin:0 0 4px}.modal-sub{margin:0 0 18px;color:#777}
.modal-link{display:block;text-align:center;padding:12px;border-radius:12px;margin:8px 0;text-decoration:none;font-weight:800;background:var(--blue);color:var(--ink)}
.modal-link.secondary{background:var(--pink)}.close{margin-top:6px;width:100%;border:1px solid #ddd2c5;border-radius:12px;padding:11px;background:transparent;cursor:pointer}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.game-card img{height:145px}}
@media(max-width:600px){header{padding-top:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game-card img{height:132px}.card-body{padding:11px}.game-name{font-size:14px}.quick-filters{gap:7px}.filter-card{font-size:12px;padding:12px 3px}}
</style></head>
<body>
<header><div class="brand">OUTPLAY GAMEHUB</div><h1>Board Game Tutorials</h1><p id="tagline">Find your game, learn the rules, and start playing.</p></header>
<main>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Search a game / 搜索桌游…"><select id="category"><option value="all">All categories · 全部分类</option><option value="Party">Party Games · 派对</option><option value="Strategy">Strategy · 策略</option><option value="Cards">Card Games · 卡牌</option></select><button class="lang" id="language">中文</button></div>
<div class="quick-filters">
<button class="filter-card active" data-category="all">All Games</button><button class="filter-card" data-category="Party">Party Games</button><button class="filter-card" data-category="Strategy">Strategy</button><button class="filter-card" data-category="Cards">Card Games</button>
</div>
<div class="section-head"><h2 id="list-title">Explore the games</h2><span class="count" id="count"></span></div>
<div id="grid" class="grid"></div><div id="empty" class="empty">No games found. Try another search. / 找不到相关桌游，请试试其他关键词。</div>
</main><footer>Outplay Gamehub · Seremban 2</footer>
<dialog id="modal"><img id="modal-img" class="modal-img" alt=""><h3 id="modal-title" class="modal-title"></h3><p id="modal-sub" class="modal-sub"></p><div id="links"></div><button class="close" id="close">Close / 关闭</button></dialog>
<script src="games.js"></script>
<script>
const games=window.OUTPLAY_GAMES||[];let zh=false,quickCategory='all';
const grid=document.getElementById('grid'),search=document.getElementById('search'),category=document.getElementById('category');
function render(){const q=search.value.trim().toLowerCase();const filtered=games.filter(g=>(!q||(g.name+' '+g.nameZh).toLowerCase().includes(q))&&(category.value==='all'||g.category===category.value)&&(quickCategory==='all'||g.category===quickCategory));
grid.innerHTML='';let shown=0;filtered.forEach((g,i)=>{shown++;const card=document.createElement('article');card.className='game-card';card.innerHTML=`<img loading="lazy" src="${g.image}" alt="${g.name} game illustration"><div class="card-body"><p class="game-name">${g.name}</p><p class="game-zh">${g.nameZh!==g.name?g.nameZh:''}</p><button class="watch">${zh?'观看教学':'Watch tutorial'}</button></div>`;card.querySelector('button').addEventListener('click',()=>openGame(g));grid.appendChild(card);});
document.getElementById('count').textContent=shown+' games';document.getElementById('empty').style.display=shown?'none':'block';}
function openGame(g){document.getElementById('modal-img').src=g.image;document.getElementById('modal-title').textContent=g.name;document.getElementById('modal-sub').textContent=g.nameZh!==g.name?g.nameZh:'';const links=document.getElementById('links');links.innerHTML='';if(g.chineseUrl){const a=document.createElement('a');a.className='modal-link secondary';a.href=g.chineseUrl;a.target='_blank';a.rel='noopener';a.textContent='中文教学 · Chinese tutorial';links.appendChild(a)}if(g.englishUrl){const a=document.createElement('a');a.className='modal-link';a.href=g.englishUrl;a.target='_blank';a.rel='noopener';a.textContent='English tutorial';links.appendChild(a)}if(!g.chineseUrl&&!g.englishUrl){links.textContent='Tutorial link coming soon · 教学链接待添加'}document.getElementById('modal').showModal();}
search.addEventListener('input',render);category.addEventListener('change',render);
document.querySelectorAll('.filter-card').forEach(b=>b.addEventListener('click',()=>{quickCategory=b.dataset.category;document.querySelectorAll('.filter-card').forEach(x=>x.classList.toggle('active',x===b));category.value='all';render()}));
document.getElementById('language').addEventListener('click',()=>{zh=!zh;document.getElementById('language').textContent=zh?'English':'中文';document.getElementById('tagline').textContent=zh?'找到桌游，观看教学，马上开始玩。':'Find your game, learn the rules, and start playing.';document.getElementById('list-title').textContent=zh?'浏览桌游':'Explore the games';render()});
document.getElementById('close').addEventListener('click',()=>document.getElementById('modal').close());render();
</script></body></html>
